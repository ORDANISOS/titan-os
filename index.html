<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- __BRAND_*__ tokens are replaced at build time by the brand-html plugin in
         vite.config.js, from VITE_BRAND_* env vars. Unset = ORDANIS defaults. -->
    <meta name="theme-color" content="__BRAND_PRIMARY__" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="__BRAND_SHORT__" />
    <meta name="description" content="__BRAND_DESCRIPTION__" />
    <title>__BRAND_NAME__</title>

    <!-- Link previews (iMessage, Slack, LinkedIn, WhatsApp, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__BRAND_NAME__" />
    <meta property="og:title" content="__BRAND_NAME__" />
    <meta property="og:description" content="__BRAND_DESCRIPTION__" />
    <meta property="og:image" content="__BRAND_OG_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__BRAND_NAME__" />
    <meta name="twitter:description" content="__BRAND_DESCRIPTION__" />
    <meta name="twitter:image" content="__BRAND_OG_IMAGE__" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="__BRAND_FAVICON__" />
    <link rel="icon" type="image/png" sizes="16x16" href="__BRAND_FAVICON_16__" />
    <link rel="icon" type="image/png" sizes="32x32" href="__BRAND_FAVICON_32__" />
    <link rel="apple-touch-icon" sizes="180x180" href="__BRAND_APPLE_ICON__" />
    <link rel="icon" type="image/png" sizes="192x192" href="__BRAND_FAVICON_192__" />
    <link rel="icon" type="image/png" sizes="512x512" href="__BRAND_FAVICON_512__" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // The service worker has been removed deliberately. Offline access is close
      // to worthless for a live financial dashboard, while a cached app shell
      // pinned users to an older build and hid newly shipped features — which
      // happened twice. This unregisters any worker a browser still holds and
      // clears its caches, so every visitor converges on the current build.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (regs) {
            var had = regs.length > 0;
            return Promise.all(regs.map(function (r) { return r.unregister(); }))
              .then(function () {
                if (window.caches) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  });
                }
              })
              .then(function () {
                // One reload is needed to escape a shell the old worker served.
                if (had) window.location.reload();
              });
          })
          .catch(function () { /* nothing to clean up */ });
      }
    </script>
  </body>
</html>
